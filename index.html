<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DZ SMS – códigos SMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2ef;--card:#fff;--ink:#16221d;--mute:#5d6b64;--line:#d5ddd8;--acc:#0f6b4f;--accink:#fff;--code:#e8590c;--err:#fde4e1;--errink:#8a1c10;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#101814;--card:#18231e;--ink:#e8f0ec;--mute:#9baba3;--line:#2b3a33;--acc:#3fcf9b;--accink:#06231a;--code:#ff9b57;--err:#3d1c18;--errink:#ffb4a8}}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
.bal{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.price{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 10px}
.price b{font-size:28px;font-weight:800}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--acc);color:var(--accink);font-family:inherit;font-weight:600;font-size:16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--code);outline-offset:2px}
.num{font-size:26px;font-weight:800;letter-spacing:.02em;word-break:break-all}
.codebox{margin:12px 0;padding:14px;border:2px dashed var(--line);border-radius:12px;text-align:center}
.code{font-size:40px;font-weight:800;letter-spacing:.18em;color:var(--code)}
.wait{color:var(--mute)}
.msg{background:var(--err);color:var(--errink);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
li:first-child{border-top:0}
.empty{color:var(--mute);font-size:14px}
.hide{display:none}
</style>
</head>
<body>
<main>
<header><h1>DZ SMS</h1><div class="bal" id="bal">R$ –</div></header>
<div class="msg hide" id="msg" role="alert"></div>

<section>
<h2>1. Escolha o serviço</h2>
<div class="chips" id="services"></div>
<h2 style="margin-top:16px">2. Escolha o país</h2>
<select id="country" aria-label="País"></select>
<div class="price"><span class="wait">Preço deste número</span><b id="price">–</b></div>
<button class="btn" id="go">Comprar número</button>
</section>

<section id="order" class="hide" aria-live="polite">
<h2 id="otitle">Seu número</h2>
<div class="num" id="onum"></div>
<div class="codebox"><div id="ostat" class="wait">Aguardando SMS…</div><div class="code hide" id="ocode"></div></div>
<div class="wait" id="otimer"></div>
<button class="btn hide" id="copy">Copiar código</button>
<button class="btn ghost" id="cancel">Cancelar e devolver o saldo</button>
</section>

<section>
<h2>Histórico desta sessão</h2>
<ul id="hist"></ul><p class="empty" id="hempty">Nenhum pedido ainda.</p>
</section>
</main>
<script>
var SERVICES={wa:"WhatsApp",tg:"Telegram",ig:"Instagram",fb:"Facebook",tt:"TikTok"};
var COUNTRIES=[[73,"Brasil"],[187,"Estados Unidos"],[16,"Reino Unido"],[22,"Índia"]];
var state={svc:"wa",bal:null,order:null,hist:[]},poll=null,tick=null;
var $=function(i){return document.getElementById(i)};
var brl=function(v){return "R$ "+Number(v).toFixed(2).replace(".",",")};

// Mesma fórmula do server.js, só para mostrar o preço antes da compra.
// O servidor é quem cobra de verdade.
function price(){var c=COUNTRIES[$("country").value][0];return 2.5*(state.svc==="wa"?1:1.1)*(c===73?1:1.5)}

async function api(path,method){
  var r=await fetch(path,{method:method||"GET"});
  var j=await r.json().catch(function(){return{}});
  if(!r.ok)throw new Error(j.error||"Erro de conexão. Tente de novo.");
  return j;
}
function showMsg(t){var m=$("msg");m.textContent=t||"";m.className=t?"msg":"msg hide"}
async function loadBalance(){try{state.bal=(await api("/api/balance")).balance}catch(e){showMsg(e.message)}render()}

function render(){
  $("bal").textContent=state.bal===null?"R$ –":brl(state.bal);
  $("price").textContent=brl(price());
  $("go").disabled=!!state.order||(state.bal!==null&&state.bal<price());
  var h=$("hist");h.innerHTML="";
  state.hist.forEach(function(x){var l=document.createElement("li"),a=document.createElement("span"),b=document.createElement("span");a.textContent=x.s+" · +"+x.n;b.textContent=x.t;l.appendChild(a);l.appendChild(b);h.appendChild(l)});
  $("hempty").className=state.hist.length?"hide":"empty";
}

function init(){
  var box=$("services");
  Object.keys(SERVICES).forEach(function(k){
    var b=document.createElement("button");b.className="chip";b.textContent=SERVICES[k];b.setAttribute("aria-pressed",k===state.svc);
    b.onclick=function(){state.svc=k;[].forEach.call(box.children,function(c){c.setAttribute("aria-pressed",c===b)});render()};
    box.appendChild(b);
  });
  COUNTRIES.forEach(function(c,i){var o=document.createElement("option");o.value=i;o.textContent=c[1];$("country").appendChild(o)});
  $("country").onchange=render;
  render();loadBalance();
}

function finish(status){
  clearInterval(poll);clearInterval(tick);
  var o=state.order;if(o)state.hist.unshift({s:o.svc,n:o.phone,t:status});
  state.order=null;$("order").className="hide";$("cancel").textContent="Cancelar e devolver o saldo";
  loadBalance();
}

$("go").onclick=async function(){
  showMsg("");$("go").disabled=true;
  var c=COUNTRIES[$("country").value];
  try{
    var r=await fetch("/api/order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service:state.svc,country:c[0]})});
    var j=await r.json().catch(function(){return{}});
    if(!r.ok)throw new Error(j.error||"Não foi possível comprar agora.");
    state.order={id:j.id,phone:j.phone,svc:SERVICES[state.svc],price:j.price,code:null,left:300};
    $("order").className="";$("otitle").textContent="Número para "+state.order.svc;$("onum").textContent="+"+j.phone;
    $("ostat").textContent="Aguardando SMS…";$("ocode").className="code hide";$("copy").className="btn hide";$("cancel").className="btn ghost";
    $("order").scrollIntoView({behavior:"smooth"});
    loadBalance();
    tick=setInterval(function(){var o=state.order;if(!o||o.code)return;o.left=Math.max(0,o.left-1);var m=Math.floor(o.left/60),s=o.left%60;$("otimer").textContent="Tempo restante: "+m+":"+(s<10?"0":"")+s},1000);
    poll=setInterval(checkOrder,3000);
  }catch(e){showMsg(e.message);state.order=null;render()}
};

async function checkOrder(){
  var o=state.order;if(!o)return;
  try{
    var j=await api("/api/order/"+o.id);
    if(j.status==="ok"&&j.code){
      o.code=j.code;clearInterval(poll);clearInterval(tick);$("otimer").textContent="";
      $("ostat").textContent="Código recebido";$("ocode").textContent=j.code;$("ocode").className="code";
      $("copy").className="btn";$("cancel").textContent="Concluir";
    }else if(j.status==="cancelled"){finish("Expirou, saldo devolvido")}
  }catch(e){/* tenta de novo no próximo ciclo */}
}

$("cancel").onclick=async function(){
  var o=state.order;if(!o)return;
  if(o.code){finish("Concluído · "+brl(o.price));return}
  try{
    var j=await api("/api/order/"+o.id+"/cancel","POST");
    if(j.status==="cancelled")finish("Cancelado, saldo devolvido");
    else showMsg(j.error||"Aguarde um pouco para cancelar.");
  }catch(e){showMsg(e.message)}
};

$("copy").onclick=function(){
  var c=state.order&&state.order.code;
  try{navigator.clipboard.writeText(c);$("copy").textContent="Copiado"}catch(e){$("copy").textContent=c}
};

init();
</script>
</body>
</html>
